<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - FilmFusion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0a141e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.75), rgba(0, 50, 100, 0.5));
            z-index: -1;
        }

        .glow {
            position: fixed;
            top: 20%;
            left: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(58,134,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }

        .glow-2 {
            top: 60%;
            left: auto;
            right: 5%;
        }

        .dashboard-nav {
            background: rgba(10, 20, 30, 0.92);
            backdrop-filter: blur(20px);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(100, 180, 250, 0.2);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 1.6rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .logo-text {
            background: linear-gradient(135deg, #64b4fa, #3a86ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }

            .nav-links a {
                text-decoration: none;
                color: rgba(255,255,255,0.7);
                font-weight: 500;
                padding: 0.5rem 1rem;
                border-radius: 40px;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.85rem;
            }

                .nav-links a:hover, .nav-links a.active {
                    background: rgba(100,180,250,0.15);
                    color: #64b4fa;
                    transform: translateY(-2px);
                }

        .notification-bell {
            position: relative;
            cursor: pointer;
            background: rgba(100,180,250,0.1);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

            .notification-bell:hover {
                background: rgba(100,180,250,0.2);
                transform: scale(1.05);
            }

            .notification-bell i {
                font-size: 1.2rem;
                color: rgba(255,255,255,0.8);
            }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            background: rgba(231,76,60,0.2);
            border: 1px solid rgba(231,76,60,0.3);
            color: #e74c3c;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

            .logout-btn:hover {
                background: rgba(231,76,60,0.3);
                transform: translateY(-2px);
            }

        .dashboard-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .glass-card {
            background: rgba(10,20,30,0.45);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid rgba(100,180,250,0.12);
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

            .glass-card:hover {
                border-color: rgba(100,180,250,0.25);
            }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 20px;
            background: #000;
            overflow: hidden;
        }

            .video-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: none;
            }

        .movie-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #64b4fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .movie-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }

        .movie-rating-badge {
            background: rgba(255,193,7,0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #ffc107;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(100,180,250,0.2);
        }

        .btn-movie {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .like-btn {
            background: rgba(39,174,96,0.2);
            color: #2ecc71;
            border: 1px solid rgba(46,204,113,0.3);
        }

            .like-btn:hover {
                background: #27ae60;
                color: white;
                transform: translateY(-2px);
            }

        .fav-btn {
            background: rgba(100,180,250,0.2);
            color: #64b4fa;
            border: 1px solid rgba(100,180,250,0.3);
        }

            .fav-btn:hover {
                background: #3a86ff;
                color: white;
                transform: translateY(-2px);
            }

            .fav-btn.active {
                background: #e74c3c;
                color: white;
                border-color: #e74c3c;
            }

        .watchlist-btn {
            background: rgba(52,152,219,0.2);
            color: #3498db;
            border: 1px solid rgba(52,152,219,0.3);
        }

            .watchlist-btn:hover {
                background: #3498db;
                color: white;
                transform: translateY(-2px);
            }

            .watchlist-btn.active {
                background: #2ecc71;
                color: white;
                border-color: #2ecc71;
            }

        .movie-details {
            margin: 1rem 0;
        }

        .detail-row {
            display: flex;
            margin-bottom: 0.8rem;
        }

        .detail-label {
            width: 100px;
            color: #64b4fa;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .detail-value {
            flex: 1;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .comments-count {
            color: white;
            font-weight: 600;
            font-size: 1rem;
        }

        .comment-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .comment-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a86ff, #64b4fa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            overflow: hidden;
            flex-shrink: 0;
        }

            .comment-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .comment-input-area {
            flex: 1;
        }

            .comment-input-area input {
                width: 100%;
                padding: 0.8rem 1rem;
                background: rgba(255,255,255,0.07);
                border: 1px solid rgba(100,180,250,0.25);
                border-radius: 40px;
                color: white;
                font-size: 0.85rem;
                transition: all 0.3s;
            }

                .comment-input-area input:focus {
                    outline: none;
                    border-color: #64b4fa;
                    background: rgba(255,255,255,0.12);
                }

                .comment-input-area input::placeholder {
                    color: rgba(255,255,255,0.4);
                }

        .comment-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 0.5rem;
        }

            .comment-actions button {
                padding: 0.4rem 1rem;
                border: none;
                border-radius: 30px;
                cursor: pointer;
                font-weight: 500;
                font-size: 0.75rem;
                transition: all 0.3s;
            }

        .comment-cancel {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.2);
        }

            .comment-cancel:hover {
                background: rgba(255,255,255,0.1);
            }

        .comment-submit {
            background: linear-gradient(135deg, #3a86ff, #64b4fa);
            color: white;
        }

            .comment-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(58,134,255,0.3);
            }

        .comment-item {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(100,180,250,0.1);
        }

        .comment-main {
            display: flex;
            gap: 1rem;
        }

        .comment-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9b59b6, #d2b0e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            overflow: hidden;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .comment-user {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.3rem;
            flex-wrap: wrap;
        }

        .comment-user-name {
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }

        .comment-user-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }

        .comment-text {
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .no-comments {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.5);
        }

            .no-comments i {
                font-size: 2rem;
                margin-bottom: 0.5rem;
                display: block;
                opacity: 0.5;
            }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #64b4fa;
        }

            .loading i {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
                display: block;
            }

        @media (max-width: 768px) {
            .dashboard-nav {
                flex-direction: column;
            }

            .dashboard-content {
                padding: 1rem;
            }

            .movie-title {
                font-size: 1.3rem;
            }

            .action-buttons {
                justify-content: center;
            }

            .comment-box {
                flex-direction: column;
            }

            .comment-avatar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="videos/v6.mp4" type="video/mp4">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-animation-of-blue-particles-12254-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">FilmFusion</span>
            </div>
            <div class="nav-links">
                <a href="user-dashboard.html"><i class="fas fa-home"></i> Home</a>
                <a href="user-favorites.html"><i class="fas fa-heart"></i> Favorites</a>
                <a href="user-watchlist.html"><i class="fas fa-clock"></i> Watchlist</a>
                <a href="user-history.html"><i class="fas fa-history"></i> History</a>
                <a href="user-profile.html"><i class="fas fa-user"></i> Profile</a>
                <div class="notification-bell" id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <!-- Video Player -->
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div class="video-container">
                    <iframe id="moviePlayer" src="about:blank" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Movie Info -->
            <div class="glass-card">
                <h1 class="movie-title" id="movieTitle">Loading...</h1>
                <div class="movie-meta">
                    <span id="movieYear">—</span><span>•</span>
                    <span id="movieGenre">—</span><span>•</span>
                    <span class="movie-rating-badge" id="movieRating">⭐ —/10</span>
                </div>

                <div class="action-buttons">
                    <button class="btn-movie like-btn" id="likeBtn"><i class="far fa-thumbs-up"></i> Like</button>
                    <button class="btn-movie fav-btn" id="favoriteBtn"><i class="far fa-heart"></i> Favorite</button>
                    <button class="btn-movie watchlist-btn" id="watchlistBtn"><i class="far fa-bookmark"></i> Watchlist</button>
                </div>

                <p id="movieOverview" style="color: rgba(255,255,255,0.7); line-height: 1.6; margin: 1rem 0;"></p>

                <div class="movie-details">
                    <div class="detail-row">
                        <div class="detail-label">Director</div>
                        <div class="detail-value" id="movieDirector">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Cast</div>
                        <div class="detail-value" id="movieCast">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Duration</div>
                        <div class="detail-value" id="movieDuration">—</div>
                    </div>
                </div>
            </div>

            <!-- Comments Section -->
            <div class="glass-card">
                <div class="comments-header">
                    <div class="comments-count" id="commentsCount">0 Comments</div>
                </div>

                <div class="comment-box">
                    <div class="comment-avatar" id="currentUserAvatar">
                        <span>👤</span>
                    </div>
                    <div class="comment-input-area">
                        <input type="text" id="commentInput" placeholder="Write a comment...">
                        <div class="comment-actions">
                            <button class="comment-cancel" id="cancelCommentBtn">Cancel</button>
                            <button class="comment-submit" id="submitCommentBtn">Comment</button>
                        </div>
                    </div>
                </div>

                <div id="commentsList">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading comments...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        (function() {
            if (!localStorage.getItem('userId')) {
                window.location.href = 'index.html';
                return;
            }

            // Set user avatar
            const userAvatar = localStorage.getItem('userAvatar');
            const avatarContainer = document.getElementById('currentUserAvatar');
            if (avatarContainer) {
                if (userAvatar && userAvatar !== 'null') {
                    avatarContainer.innerHTML = `<img src="${userAvatar}" alt="avatar" style="width:100%; height:100%; object-fit:cover;">`;
                } else {
                    const userName = localStorage.getItem('userName') || 'U';
                    avatarContainer.innerHTML = `<span>${userName.charAt(0).toUpperCase()}</span>`;
                }
            }

            // Update notification badge
            if (typeof window.updateNotificationBadge === 'function') {
                window.updateNotificationBadge();
            }

            // Load movie
            if (typeof window.loadMovieForWatch === 'function') {
                window.loadMovieForWatch();
            }

            // Setup button listeners
            const likeBtn = document.getElementById('likeBtn');
            if (likeBtn && typeof window.likeCurrentMovie === 'function') {
                likeBtn.onclick = window.likeCurrentMovie;
            }

            const favBtn = document.getElementById('favoriteBtn');
            if (favBtn && typeof window.toggleMovieFavorite === 'function') {
                favBtn.onclick = window.toggleMovieFavorite;
            }

            const watchlistBtn = document.getElementById('watchlistBtn');
            if (watchlistBtn && typeof window.toggleMovieWatchlist === 'function') {
                watchlistBtn.onclick = window.toggleMovieWatchlist;
            }

            const submitBtn = document.getElementById('submitCommentBtn');
            if (submitBtn && typeof window.addWatchComment === 'function') {
                submitBtn.onclick = window.addWatchComment;
            }

            const cancelBtn = document.getElementById('cancelCommentBtn');
            if (cancelBtn && typeof window.clearCommentInput === 'function') {
                cancelBtn.onclick = window.clearCommentInput;
            }

            const notifBell = document.getElementById('notificationBell');
            if (notifBell && typeof window.showNotificationsModal === 'function') {
                notifBell.onclick = window.showNotificationsModal;
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn && typeof window.logout === 'function') {
                logoutBtn.onclick = window.logout;
            }
        })();
    </script>
</body>
</html>
